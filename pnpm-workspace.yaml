packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # proxy-addr: IPv4-mapped IPv6 trust subnet による IP 偽装（critical, 修正 >=2.0.8）
  proxy-addr: ^2.0.8
  # body-parser: 圧縮リクエスト後続バイトによる DoS（high, 修正 >=2.4.0）
  body-parser: ^2.4.0
  # multer: 保留中の非同期 fileFilter による DoS（high, 修正 >=2.5.0）
  multer: ^2.5.0
  # postcss: sourceMappingURL 経由の任意ファイル読取/パストラバーサル（high, 修正 >=8.5.18）
  postcss: ^8.5.18
  # nanoid: 不正サイズ指定で無限ループ（high, 修正 >=3.3.18）
  nanoid: ^3.3.18
  # browserslist: キャッシュ無制限増加・stats 注入によるクラッシュ（high, 修正 >=4.28.7）
  browserslist: ^4.28.7
  # source-map-js: インデックス付き source map による DoS（high, 修正 >=1.2.2）
  source-map-js: ^1.2.2
  # 以下は依存先が版を固定していて、通常の更新では修正版にならないものへの対処（2026-11 security-check）
  # deepmerge-ts: @prisma/config@6.19.3 が 7.1.5 に固定（CVE-2026-40345, 修正 8.0.0）
  deepmerge-ts@7.1.5: 8.0.0
  # glob: @nestjs/cli@11 が ^13 を要求（CVE-2026-118773, 修正 14.0.2）。開発時のみ使用
  glob@13: ^14.0.6
  # minimatch: @ts-morph/common@0.27（shadcn 経由）と glob@13 が ^10 を要求（CVE-2026-118764, 修正 11.0.1）。開発時のみ使用
  minimatch@10: ^11.0.9
